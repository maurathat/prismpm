<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism model editor</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; font: 13px/1.4 system-ui, sans-serif; background: #1e1e1e; color: #ddd; }
  #top { display: flex; align-items: center; border-bottom: 1px solid #333; }
  #strip { padding: .35rem .75rem; flex: 1; }
  #download, #build { font: inherit; color: #ddd; background: none; border: 1px solid #555; border-radius: 3px; padding: .1rem .5rem; margin-right: .5rem; cursor: pointer; white-space: nowrap; }
  #took { padding: .35rem .75rem; border-bottom: 1px solid #333; overflow-wrap: anywhere; }
  #strip[data-state="ok"] { color: #6fcf8f; } #strip[data-state="bad"] { color: #ff8a8a; }
  #match { padding: .35rem .75rem; border-bottom: 1px solid #333; }
  #draft { padding: .35rem .75rem; border-bottom: 1px solid #333; color: #d7ba7d; }
  #draft button { font: inherit; color: inherit; background: none; border: 1px solid currentColor; border-radius: 3px; padding: 0 .4rem; cursor: pointer; }
  #match[data-state="same"] { color: #6fcf8f; } #match[data-state="other"] { color: #ff8a8a; font-weight: 600; }
  #workbench { flex: 1; min-height: 0; position: relative; }
</style>
</head>
<body>
<div id="top"><div id="strip" role="status">Starting…</div><button id="build" type="button" title="Check, prove and build this model into a holo, here in this tab">Build</button><button id="download" type="button" title="The model as it stands in the editor, as one tar archive">Download model</button></div>
<div id="took" role="status" hidden></div>
<div id="match" role="status" hidden></div>
<div id="draft" role="status" hidden><span id="draftText"></span> <button id="draftDiscard" type="button" hidden>Discard my changes</button></div>
<div id="workbench"></div>
<script type="module" src="./src/model-editor.js"></script>
</body>
</html>
