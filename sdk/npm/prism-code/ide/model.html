<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism model editor</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; font: 13px/1.4 system-ui, sans-serif; background: #1e1e1e; color: #ddd; }
  #top { display: flex; align-items: center; border-bottom: 1px solid #333; }
  #strip { padding: .35rem .75rem; flex: 1; }
  #liveLabel { white-space: nowrap; margin-right: .5rem; color: #ddd; }
  #starters { white-space: nowrap; } #starters a { color: #9cc4ff; margin-left: .35rem; }
  #download, #build { font: inherit; color: #ddd; background: none; border: 1px solid #555; border-radius: 3px; padding: .1rem .5rem; margin-right: .5rem; cursor: pointer; white-space: nowrap; }
  #took { padding: .35rem .75rem; border-bottom: 1px solid #333; overflow-wrap: anywhere; }
  #pushForm { padding: .35rem .75rem; border-bottom: 1px solid #333; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  #pushForm[hidden] { display: none; }
  #pushForm input { font: 12px/1.4 ui-monospace, monospace; background: #111; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: .15rem .4rem; }
  #pushTarget { min-width: 18rem; }
  #pushForm button { font: inherit; color: #ddd; background: none; border: 1px solid #555; border-radius: 3px; padding: .1rem .5rem; cursor: pointer; }
  #pushSaid { overflow-wrap: anywhere; }
  #run { padding: .35rem .75rem; border-bottom: 1px solid #333; max-height: 32vh; overflow: auto; }
  #run[data-state="verified"] #runVerdict { color: #6fcf8f; } #run[data-state="refused"] #runVerdict { color: #ff8a8a; }
  #run form { display: flex; gap: .5rem; align-items: center; margin: .3rem 0; flex-wrap: wrap; }
  #run input[type="text"] { font: 12px/1.4 ui-monospace, monospace; flex: 1; min-width: 12rem; background: #111; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: .15rem .4rem; }
  #run button { font: inherit; color: #ddd; background: none; border: 1px solid #555; border-radius: 3px; padding: .1rem .5rem; cursor: pointer; }
  #runView { display: block; width: 100%; height: 14rem; border: 1px solid #555; border-radius: 3px; background: #fff; margin: .3rem 0; }
  #runLog { margin: 0; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  #strip[data-state="ok"] { color: #6fcf8f; } #strip[data-state="bad"] { color: #ff8a8a; }
  #match { padding: .35rem .75rem; border-bottom: 1px solid #333; }
  #draft { padding: .35rem .75rem; border-bottom: 1px solid #333; color: #d7ba7d; }
  #draft button { font: inherit; color: inherit; background: none; border: 1px solid currentColor; border-radius: 3px; padding: 0 .4rem; cursor: pointer; }
  #match[data-state="same"] { color: #6fcf8f; } #match[data-state="other"] { color: #ff8a8a; font-weight: 600; }
  #workbench { flex: 1; min-height: 0; position: relative; }
</style>
</head>
<body>
<div id="top"><div id="strip" role="status">Starting…</div><span id="starters"><a href="?project=../app/model/" title="The one template every Prism app starts from: the app prism-code init and build write, with theorems of its own">Start a new app</a></span><button id="build" type="button" title="Check, prove and build this model into a holo, here in this tab">Build</button><label id="liveLabel" title="After each edit that checks and whose theorems are all proved, build the model and show the app that was built. An edit that is not fully proved changes nothing that is running."><input id="live" type="checkbox" checked> Live</label><button id="download" type="button" title="The model as it stands in the editor, as one tar archive">Download model</button></div>
<div id="took" role="status" hidden></div>
<form id="pushForm">
  <label>Registry <input id="pushTarget" type="text" placeholder="registry.example/name:tag" aria-label="The registry, name and tag to push the built holo to, or to pull a holo from" autocomplete="off" spellcheck="false"></label>
  <label title="Only if the registry asks for them. Kept in this tab's memory for this push and nowhere else.">as <input id="pushUser" type="text" aria-label="A user name, if the registry asks" autocomplete="off" spellcheck="false" size="10"> <input id="pushSecret" type="password" aria-label="A password or token, if the registry asks" autocomplete="off" size="14"></label>
  <button id="pushButton" type="submit" disabled title="Push the holo that was just built">Push</button>
  <button id="pullButton" type="button" title="Fetch the holo at this address and judge it here. Nothing of it is run unless it is judged verified">Pull</button>
  <span id="pushSaid" role="status"></span>
</form>
<div id="run" hidden>
  <div id="runVerdict" role="status"></div>
  <form id="runForm" hidden>
    <input id="runInput" type="text" aria-label="A request to the app" autocomplete="off" spellcheck="false">
    <button type="submit">Run</button>
    <label title="For an app that keeps its state in the request, as the stateful starter does: each request is sent after the earlier ones, joined by a semicolon"><input id="runKeep" type="checkbox"> send the earlier requests with it</label>
    <button id="runClear" type="button">Start over</button>
  </form>
  <iframe id="runView" title="The app's own page" sandbox="allow-scripts allow-forms" referrerpolicy="no-referrer" hidden></iframe>
  <pre id="runLog" aria-label="Requests and answers"></pre>
</div>
<div id="match" role="status" hidden></div>
<div id="draft" role="status" hidden><span id="draftText"></span> <button id="draftDiscard" type="button" hidden>Discard my changes</button></div>
<div id="workbench"></div>
<script type="module" src="./src/model-editor.js"></script>
</body>
</html>
