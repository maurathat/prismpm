[package]
name = "prism-evaluator-guest"
version = "0.1.0"
edition = "2021"
description = "The Core-Wasm guest that runs a Prism app's model: one fixed evaluator, the app's program as data."
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace]
