name: init end to end

# The one command a Prism app starts with, measured as a consumer meets it:
# `npm create prism-code` (which is `npx prism-code@latest init`), then check,
# build and verify, from the packed packages on a clean GitHub runner with no
# network once they are installed. prism-code ships LexLean and Lean's kernel
# as WebAssembly, so nothing is pulled and no container runs.
#
# Steps, each timed:
#   1. npm create prism-code app          (a starter model and the Prism skill)
#   2. npx prism-code check --json        (the model checks, every theorem proved)
#   3. npx prism-code build --json        (the app, with nothing compiled)
#   4. npx prism-code verify --json       (every acceptance vector replayed)
# The job fails when 1 to 4 exceed two minutes.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - sdk/npm/prism-code/bin/**
      - sdk/npm/prism-code/src/**
      - sdk/npm/prism-code/skill/**
      - sdk/npm/prism-code/templates/**
      - sdk/npm/prism-code/wasm/**
      - sdk/npm/prism-code/package.json
      - sdk/npm/create-prism-code/**
      - .github/workflows/init-e2e.yml

permissions:
  contents: read

concurrency:
  group: init-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-to-verify:
    name: npm create prism-code to a verified app, under two minutes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Pack prism-code and create-prism-code as a consumer gets them
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkgs"
          (cd sdk/npm/prism-code && npm pack --pack-destination "$RUNNER_TEMP/pkgs")
          (cd sdk/npm/create-prism-code && npm pack --pack-destination "$RUNNER_TEMP/pkgs")
          ls -l "$RUNNER_TEMP/pkgs"
      - name: npm create prism-code, then check, build and verify, timed and offline
        shell: bash
        env:
          # Nothing is fetched and nothing is kept from an earlier run: the home is new and empty.
          PRISM_CODE_TIER: offline
          PRISM_LEXLEAN_FETCH: '0'
          PRISM_TELEMETRY: '0'
        run: |
          set -euo pipefail
          export PRISM_HOME="$RUNNER_TEMP/prism-home"
          work="$RUNNER_TEMP/clean"
          mkdir -p "$work" && cd "$work"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pkgs/prism-code-*.tgz "$RUNNER_TEMP"/pkgs/create-prism-code-*.tgz > /dev/null
          start=$(date +%s)
          npx --no-install create-prism-code app
          scaffolded=$(date +%s)
          cd app
          test -f src/App.lex.tex
          test -f .claude/skills/prism/SKILL.md
          test -f .agents/skills/prism/SKILL.md
          npx --no-install prism-code check --json > check.json
          checked=$(date +%s)
          npx --no-install prism-code build --json > build.json
          built=$(date +%s)
          npx --no-install prism-code verify --json > verify.json
          verified=$(date +%s)
          node -e '
            const read = (f) => JSON.parse(require("fs").readFileSync(f, "utf8"));
            const [check, build, verify] = ["check.json", "build.json", "verify.json"].map(read);
            for (const r of [check, build, verify]) if (!r.ok) { console.error(JSON.stringify(r, null, 2)); process.exit(1); }
            if (!(check.summary.theoremsDeclared > 0 && check.summary.theoremsVerified === check.summary.theoremsDeclared)) process.exit(1);
            if (!(verify.summary.vectorsTotal > 0 && verify.summary.vectorsPassed === verify.summary.vectorsTotal && verify.summary.identitiesVerified)) process.exit(1);
          '
          # The home holds what a proof remembers and nothing that was fetched.
          test ! -d "$PRISM_HOME/kappa/pinned"
          total=$((verified - start))
          {
            echo "### npm create prism-code to a verified app"
            echo "| Step | Seconds |"
            echo "| --- | --- |"
            echo "| init | $((scaffolded - start)) |"
            echo "| check | $((checked - scaffolded)) |"
            echo "| build | $((built - checked)) |"
            echo "| verify | $((verified - built)) |"
            echo "| total (limit 120) | $total |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "total ${total}s"
          test "$total" -le 120
