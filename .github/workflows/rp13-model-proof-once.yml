# One-time proof and model-generated docs projection. Self-removes before merge.
name: One-time RP-13 model proof
on:
  push:
    branches:
      - feature/sdk-passive-readme-classifier-20261122
permissions:
  contents: read
jobs:
  project:
    if: github.repository == 'UOR-Foundation/prismpm' && github.ref == 'refs/heads/feature/sdk-passive-readme-classifier-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify all portable classifier planted cases without Docker
        run: |
          set -euo pipefail
          python3 -m unittest discover -s sdk/ci -p 'test_passive_readme_scope.py' -v
      - name: Generate model-owned documentation from RP-13 contract
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- validate-model --write
          grep -Fq 'RP-13' CONFORMANCE.md
      - name: Commit model projection and self-remove write workflow
        run: |
          set -euo pipefail
          git config user.name uor-prismpm-model-writer
          git config user.email uor-prismpm-model-writer@users.noreply.github.com
          git add CONFORMANCE.md ERRORS.md
          git rm .github/workflows/rp13-model-proof-once.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'expected projection and workflow-removal changes' >&2; exit 1; }
          git commit -m 'model(sdk): regenerate RP-13 conformance projection'
          git fetch origin refs/heads/feature/sdk-passive-readme-classifier-20261122:refs/remotes/origin/feature/sdk-passive-readme-classifier-20261122
          git rebase origin/feature/sdk-passive-readme-classifier-20261122
          git push origin HEAD:refs/heads/feature/sdk-passive-readme-classifier-20261122
