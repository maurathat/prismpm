name: dev end to end

# Issue #288's acceptance, measured on a clean runner:
#   offline   the studio in a real browser, in a network namespace with only
#             loopback, so nothing it asks for from outside can arrive
#   measure   edit to verdict on the canonical template and two starter fixtures, built in this process: prism-code checks the
#             model, proves its theorems and writes the holo with nothing compiled, and the
#             studio judges it. The job holds the time the loop adds on top of the build
#             (docs/proposals/288-prism-dev.md, The floor). No image is pulled and no
#             container runs.

on:
  pull_request:
    paths:
      - sdk/npm/prism-code/src/dev*.mjs
      - sdk/npm/prism-code/src/studio/**
      - sdk/npm/prism-code/scripts/dev-measure.mjs
      - .github/workflows/dev-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: the studio with no network
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Measure the loop in a browser, in a namespace with only loopback
        shell: bash
        run: |
          set -euo pipefail
          sudo env "PATH=$PATH" "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY" unshare -n sh -ec '
            ip link set lo up
            if curl --silent --max-time 5 https://github.com > /dev/null; then
              echo "this namespace reaches the network, so the test would prove nothing" >&2
              exit 1
            fi
            node sdk/npm/prism-code/scripts/dev-measure.mjs --stand-in --edits 4 \
              --chrome "$(command -v google-chrome)" --summary "$GITHUB_STEP_SUMMARY"
          '

  measure:
    name: edit to verdict on the ${{ matrix.starter }} app, built in this process
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each edit is to text no theorem or acceptance vector reads, so the build still succeeds.
          # The canonical template is what init writes; the starters are fixtures init no longer offers.
          - starter: template
            from: against its locked BLAKE3 label.
            to: against the BLAKE3 label it is locked to.
          - starter: decision-app
            from: from the hours parked and the vehicle type.
            to: from the hours parked and the kind of vehicle.
          - starter: stateful-app
            from: Books seats at a dinner for twelve until the host closes the list.
            to: Books seats at a dinner for twelve, until the host closes the list.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Start the app
        shell: bash
        env:
          STARTER: ${{ matrix.starter }}
        run: |
          set -euo pipefail
          if [ "$STARTER" = template ]; then
            node sdk/npm/prism-code/bin/prism-code.mjs init "$RUNNER_TEMP/app" --no-skill
          else
            node --input-type=module -e '
              import { copyFileSync } from "node:fs";
              import { join } from "node:path";
              import { startApp } from "./sdk/npm/prism-code/src/journey/project.mjs";
              const [dir, name] = process.argv.slice(1);
              startApp(dir, name);
              copyFileSync(`sdk/npm/prism-code/test/fixtures/starters/${name}/prism.toml`, join(dir, "prism.toml"));
            ' "$RUNNER_TEMP/app" "$STARTER"
          fi
      - name: Measure edit to verdict
        shell: bash
        env:
          EDIT_FROM: ${{ matrix.from }}
          EDIT_TO: ${{ matrix.to }}
          # Nothing is fetched and nothing is kept from an earlier run: the home is new and empty.
          PRISM_CODE_TIER: offline
          PRISM_LEXLEAN_FETCH: '0'
          PRISM_TELEMETRY: '0'
        run: |
          set -euo pipefail
          export PRISM_HOME="$RUNNER_TEMP/prism-home"
          # The build takes seconds, so an edit is held to the time the loop adds, not to a multiple of the build.
          node sdk/npm/prism-code/scripts/dev-measure.mjs \
            --project "$RUNNER_TEMP/app" \
            --from "$EDIT_FROM" --to "$EDIT_TO" \
            --edits 4 --chrome "$(command -v google-chrome)" \
            --timeout-seconds 300 --overhead-seconds 2 --summary "$GITHUB_STEP_SUMMARY"
