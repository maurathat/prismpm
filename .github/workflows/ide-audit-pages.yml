name: IDE audit page

# Publishes the Prism IDE's audit view (sdk/npm/prism-code/ide/audit) on this repository's GitHub Pages, at
# <pages>/audit/. A visitor gives it the address of a published Prism app and it shows, in their tab, the app's
# rules, each guarantee with what backs it, its examples replayed and its fingerprint.
#
# The site is files copied from this checkout by ide/tools/build-audit-site.mjs: the page, prism-code's src as the
# page imports it, and the rule judge archive. Nothing is compiled and nothing is fetched.
#
# Beside it, at <pages>/edit/, is the edit page (sdk/npm/prism-code/ide/edit), and at <pages>/edit/ide/ the same
# loop in the VS Code workbench: a LexLean model is opened, checked by LexLean and its guarantees judged by Lean's
# kernel, in the visitor's tab. ide/tools/build-edit-site.mjs assembles it. For this part two things are fetched,
# by prism-code itself and admitted only by the labels it pins (the LexLean executable and the kernel),
# and one thing is compiled: the workbench, from the packages ide/package-lock.json pins.
#
# A Pages site holds one deployment. factory.yml can also deploy here, on a manual run with the repository
# variable FACTORY_PAGES set to true. That is not set today. Whoever sets it must first make one of the two
# workflows publish both, or the later deployment replaces the earlier.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sdk/npm/prism-code/ide/audit/**
      - sdk/npm/prism-code/ide/edit/**
      - sdk/npm/prism-code/ide/src/**
      - sdk/npm/prism-code/ide/model.html
      - sdk/npm/prism-code/ide/vite.config.js
      - sdk/npm/prism-code/ide/vite.model.config.js
      - sdk/npm/prism-code/ide/package-lock.json
      - sdk/npm/prism-code/ide/tools/build-audit-site.mjs
      - sdk/npm/prism-code/ide/tools/build-edit-site.mjs
      - sdk/npm/prism-code/ide/tools/build-offline-site.mjs
      - sdk/npm/prism-code/ide/offline/**
      - sdk/npm/prism-code/ide/tools/edit-project.mjs
      - sdk/npm/prism-code/ide/tools/terminal-site.mjs
      - sdk/npm/prism-code/model/ide-terminal-*/**
      - sdk/npm/prism-code/model/ide-audit/**
      - sdk/npm/prism-code/model/ide-capability-gate/**
      - sdk/npm/prism-code/src/**
      - sdk/npm/prism-code/test/fixtures/kernel/**
      - .github/workflows/ide-audit-pages.yml

permissions:
  contents: read

concurrency:
  group: ide-audit-pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble the audit site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/npm/prism-code
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      # What is published is what these hold: the signature checks against the verdicts pinned for `check` and
      # the Sigstore conformance bundles.
      - name: The page's signature checks pass
        run: |
          node ide/tools/signature-test.mjs
          node ide/tools/keyless-test.mjs
      - name: Assemble the site
        run: node ide/tools/build-audit-site.mjs "$RUNNER_TEMP/audit-site" "$GITHUB_SHA"
      - name: The site is what the page needs
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/audit-site"
          for f in index.html audit/index.html audit/audit.mjs audit/signature.mjs audit/keyless.mjs audit/audit-status.rule-app.json \
                   audit/judge/kernel.holo audit/prism-code/index.mjs audit/prism-code/blake3.mjs audit/prism-code/vendor/verify.mjs audit/site.json; do
            test -s "$site/$f" || { echo "missing: $f"; exit 1; }
          done
          # The rule judge archive is the one the audit-status record names.
          python3 - "$site" <<'PY'
          import hashlib, json, sys
          site = sys.argv[1]
          want = json.load(open(f'{site}/audit/audit-status.rule-app.json'))['kernel']['holo']
          got = 'sha256:' + hashlib.sha256(open(f'{site}/audit/judge/kernel.holo', 'rb').read()).hexdigest()
          assert got == want, f'the judge archive is {got}, the audit-status record names {want}'
          PY
      # The workbench is the one thing compiled, from the packages the lock pins. No install script runs.
      - name: Build the workbench editor
        working-directory: sdk/npm/prism-code/ide
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx vite build -c vite.model.config.js
      # The model the page opens when it is given no other is the capability gate's.
      - name: Add the edit page
        run: node ide/tools/build-edit-site.mjs "$RUNNER_TEMP/audit-site" model/ide-capability-gate "$GITHUB_SHA"
      - name: The edit page has what it needs, and its executables are the pinned ones
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/audit-site"
          for f in audit/index.html edit/index.html edit/edit.mjs edit/app-match.mjs edit/lexlean-worker.mjs edit/prove-worker.mjs edit/pin.json edit/lexlean.wasm.gz                    edit/kernel/manifest.json edit/project.json edit/project/lexlean.toml edit/prism-code/journey/rule-table.mjs                    edit/prism-code/journey/wasi-memory.mjs edit/ide/index.html edit/site.json \
                   edit/terminal/terminal.mjs edit/terminal/session.mjs edit/terminal/shell.mjs edit/terminal/line-editor.mjs edit/terminal/programs.mjs edit/terminal/kappa-space.mjs edit/terminal/effects.mjs edit/terminal/pins.json edit/terminal/tables.json \
                   edit/vendor/xterm/xterm.mjs edit/vendor/xterm/xterm.css edit/vendor/xterm/addon-fit.mjs edit/vendor/xterm/addon-webgl.mjs edit/vendor/xterm/addon-web-links.mjs edit/vendor/xterm/addon-search.mjs edit/vendor/xterm/addon-unicode11.mjs; do
            test -s "$site/$f" || { echo "missing: $f"; exit 1; }
          done
          # What is published decodes to what prism-code pins: LexLean by its BLAKE3 label, the kernel by its manifest.
          node --input-type=module - "$site/edit" <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';
          import { kappa } from './src/blake3.mjs';
          import { LEXLEAN_WASM } from './src/journey/lexlean-wasm.mjs';
          const site = process.argv[2];
          const bytes = (file) => gunzipSync(readFileSync(`${site}/${file}`));
          const got = kappa(bytes('lexlean.wasm.gz'));
          if (got !== LEXLEAN_WASM.kappa) throw new Error(`lexlean.wasm.gz decodes to ${got}, not the pinned ${LEXLEAN_WASM.kappa}`);
          // Pages publishes no file or folder whose name starts with a dot, so the model's listing may name none,
          // and every file it names is there.
          for (const path of JSON.parse(readFileSync(`${site}/project.json`, 'utf8')).files) {
            if (path.split('/').some((part) => part.startsWith('.'))) throw new Error(`project.json lists ${path}, which Pages would not publish`);
            readFileSync(`${site}/project/${path}`);
          }
          const manifest = JSON.parse(readFileSync(`${site}/kernel/manifest.json`, 'utf8'));
          for (const part of [manifest.glue, manifest.wasm, manifest.library]) {
            // The kernel's manifest names its three files by SHA-256, which is what the page's worker checks.
            const have = createHash('sha256').update(bytes(`kernel/${part.file}`)).digest('hex');
            if (have !== part.sha256) throw new Error(`kernel/${part.file} decodes to sha256:${have}, not the pinned sha256:${part.sha256}`);
          }
          console.log('LexLean and the kernel are the pinned ones');
          JS
      # Last, over the whole site: every published file is listed with its BLAKE3 label, and a service worker
      # serves each one only as those bytes, from the visitor's browser once it has them.
      - name: Make the site work offline, by content
        run: node ide/tools/build-offline-site.mjs "$RUNNER_TEMP/audit-site" "$GITHUB_SHA"
      - name: The worker parses, and its listing names every page by the label of its bytes
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/audit-site"
          node --check "$site/sw.js"
          node --input-type=module - "$site" <<'JS'
          import { readFileSync } from 'node:fs';
          import { kappa } from './src/blake3.mjs';
          const site = process.argv[2];
          const listing = JSON.parse(readFileSync(`${site}/offline.json`, 'utf8'));
          const paths = Object.keys(listing.files);
          for (const needed of ['index.html', 'audit/index.html', 'edit/index.html', 'edit/ide/index.html', 'edit/lexlean.wasm.gz', 'edit/kernel/manifest.json']) {
            if (!paths.includes(needed)) throw new Error(`offline.json does not list ${needed}`);
          }
          for (const path of paths) {
            if (path.split('/').some((part) => part.startsWith('.'))) throw new Error(`offline.json lists ${path}, which Pages would not publish`);
            const have = kappa(readFileSync(`${site}/${path}`));
            if (have !== listing.files[path].kappa) throw new Error(`${path} is ${have}, and offline.json names ${listing.files[path].kappa}`);
          }
          if (paths.includes('sw.js') || paths.includes('offline.json')) throw new Error('the worker and its listing must not list themselves');
          console.log(`${paths.length} files listed, each the bytes its label names`);
          JS
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/audit-site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}audit/
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
